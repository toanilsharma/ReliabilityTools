[build]
  command   = "npm run build"
  publish   = "dist"
  functions = ""

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA routing: serve index.html for all unmatched routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache-Control headers for static assets (30 days / 1 year for hashed assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

