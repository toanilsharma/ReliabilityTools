[build]
  command   = "npm run build"
  publish   = "dist"
  functions = ""

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA routing: serve index.html for all unmatched routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache-Control headers for static assets (30 days / 1 year for hashed assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Self-hosted font caching (1 year immutable)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# PDF, Report, and Export Endpoints: send X-Robots-Tag noindex header
[[headers]]
  for = "/pdf/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/reports/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/export/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.csv"
  [headers.values]
    X-Robots-Tag = "noindex"

# API Endpoints: send X-Robots-Tag noindex header and allow CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

# Global Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
